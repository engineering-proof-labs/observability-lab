name: observability-lab

x-app: &app
  environment: &trace-environment
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    OTEL_SEMCONV_STABILITY_OPT_IN: http
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
    interval: 2s
    timeout: 1s
    retries: 10
  stop_grace_period: 10s

services:
  checkout:
    <<: *app
    build:
      context: .
      target: checkout
    depends_on:
      shipping:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CHECKOUT_PORT:-8080}:8080"

  shipping:
    <<: *app
    build:
      context: .
      target: shipping
    environment:
      <<: *trace-environment
      SHIPPING_DELAY_MS: "${SHIPPING_DELAY_MS:-0}"
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "127.0.0.1:16686:16686"
